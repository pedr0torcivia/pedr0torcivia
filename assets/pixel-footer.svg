<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="110" viewBox="0 0 1200 110" role="img" aria-labelledby="title">
  <title id="title">Build, learn, iterate</title>
  <defs><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#39d5ff"/><stop offset="1" stop-color="#a371f7"/></linearGradient></defs>
  <rect width="1200" height="110" rx="8" fill="#0d1117"/>
  <path d="M0 3h1200" stroke="#30363d" stroke-width="2"/>
  <g shape-rendering="crispEdges" fill="#172033">
    <path d="M0 88h72V72h48V88h96V58h48v30h120V76h72v12h288V68h72v20h96V52h48v36h120V72h72v16h72v22H0z"/>
  </g>
  <text x="600" y="53" text-anchor="middle" fill="#8b949e" font-family="Consolas, 'Courier New', monospace" font-size="17" letter-spacing="3">BUILD  •  LEARN  •  ITERATE</text>
  <rect x="260" y="68" width="680" height="4" fill="#243247"/>
  <rect x="260" y="65" width="70" height="10" fill="url(#line)"><animate attributeName="x" values="260;870;260" dur="4.2s" repeatCount="indefinite"/></rect>
  <g fill="#39d5ff" shape-rendering="crispEdges">
