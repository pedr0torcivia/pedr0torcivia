<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Pedro Torcivia — Backend, AI and Systems Engineering</title>
  <desc id="desc">Modern dark banner with blue and violet gradients and clean professional typography.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b172a"/>
      <stop offset="1" stop-color="#11152e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".28"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#background)"/>
  <circle cx="1030" cy="50" r="230" fill="url(#glow)" filter="url(#blur)"/>
  <circle cx="160" cy="330" r="210" fill="#8b5cf6" opacity=".08" filter="url(#blur)"/>

  <path d="M785 0h415v238L1015 320H760l175-107z" fill="none" stroke="#38bdf8" stroke-opacity=".15" stroke-width="2"/>
  <path d="M890 0h310v164L1062 264H825l145-92z" fill="none" stroke="#8b5cf6" stroke-opacity=".2" stroke-width="2"/>
  <circle cx="1040" cy="96" r="5" fill="#38bdf8"/>
  <circle cx="980" cy="188" r="4" fill="#8b5cf6"/>
  <path d="M1040 96l-60 92M980 188l88 64" stroke="url(#accent)" stroke-opacity=".55"/>

  <rect x="72" y="66" width="64" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="72" y="128" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="50" font-weight="700" letter-spacing=".5">Pedro Torcivia</text>
  <text x="72" y="177" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" letter-spacing="2">BACKEND · AI · SYSTEMS ENGINEERING</text>
  <text x="72" y="226" fill="#a7b3c5" font-family="Segoe UI, Arial, sans-serif" font-size="19">Building reliable software from architecture to production.</text>
  <text x="72" y="266" fill="#6f7f95" font-family="Segoe UI, Arial, sans-serif" font-size="16">Córdoba, Argentina  ·  UTN FRC</text>

  <rect x="0" y="316" width="1200" height="4" rx="2" fill="url(#accent)"/>
</svg>

