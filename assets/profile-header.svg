<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Pedro Torcivia — animated 8-bit engineering profile</title>
  <desc id="desc">Animated terminal banner with pixel circuitry, typing command, blinking cursor and status indicators.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b12"/>
      <stop offset=".58" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#11102a"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39d5ff"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#243247" stroke-width="1" opacity=".28"/>
    </pattern>
    <clipPath id="typing"><rect x="48" y="74" width="0" height="36"><animate attributeName="width" values="0;360;360" keyTimes="0;.72;1" dur="3.6s" repeatCount="indefinite"/></rect></clipPath>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1200" height="360" rx="12" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="12" fill="url(#grid)"/>
  <rect x="2" y="2" width="1196" height="356" rx="10" fill="none" stroke="url(#neon)" stroke-width="3" stroke-dasharray="90 18">
    <animate attributeName="stroke-dashoffset" values="0;-108" dur="5s" repeatCount="indefinite"/>
  </rect>

  <path d="M12 12h1176v42H12z" fill="#151b23"/>
  <rect x="26" y="28" width="12" height="12" fill="#ff6b6b"/><rect x="50" y="28" width="12" height="12" fill="#f5b942"/><rect x="74" y="28" width="12" height="12" fill="#44c767"/>
  <text x="108" y="39" fill="#8b949e" font-family="Consolas, 'Courier New', monospace" font-size="16">pedro@portfolio: ~/profile</text>
  <text x="1080" y="39" fill="#3fb950" font-family="Consolas, 'Courier New', monospace" font-size="14">ONLINE</text>
  <rect x="1058" y="28" width="10" height="10" fill="#3fb950"><animate attributeName="opacity" values="1;.25;1" dur="1.4s" repeatCount="indefinite"/></rect>

  <g clip-path="url(#typing)">
    <text x="48" y="99" fill="#3fb950" font-family="Consolas, 'Courier New', monospace" font-size="22">$ ./introduce --professional</text>
  </g>
  <rect x="48" y="79" width="10" height="24" fill="#39d5ff">
    <animate attributeName="x" values="48;366;366" keyTimes="0;.72;1" dur="3.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;1" keyTimes="0;.78;.89;1" dur="3.6s" repeatCount="indefinite"/>
  </rect>

  <text x="48" y="166" fill="#f0f6fc" font-family="Consolas, 'Courier New', monospace" font-size="44" font-weight="700" letter-spacing="2">PEDRO TORCIVIA</text>
  <text x="50" y="213" fill="#39d5ff" font-family="Consolas, 'Courier New', monospace" font-size="22">BACKEND  •  AI  •  SYSTEMS</text>
  <text x="50" y="254" fill="#bc8cff" font-family="Consolas, 'Courier New', monospace" font-size="18">SYSTEMS ENGINEERING // UTN FRC</text>
  <text x="50" y="292" fill="#8b949e" font-family="Consolas, 'Courier New', monospace" font-size="16">Córdoba, Argentina</text>

  <g transform="translate(735 80)" shape-rendering="crispEdges">
    <rect x="0" y="0" width="410" height="224" fill="#0d1117" stroke="#30363d" stroke-width="3"/>
    <text x="24" y="34" fill="#8b949e" font-family="Consolas, 'Courier New', monospace" font-size="14">SYSTEM STATUS</text>
    <g fill="none" stroke="#243247" stroke-width="8">
      <path d="M26 66h270"/><path d="M26 112h270"/><path d="M26 158h270"/>
    </g>
    <g stroke-width="8" fill="none">
      <path d="M26 66h225" stroke="#39d5ff"><animate attributeName="stroke-dasharray" values="130 140;225 45;180 90;225 45" dur="4s" repeatCount="indefinite"/></path>
      <path d="M26 112h205" stroke="#a371f7"><animate attributeName="stroke-dasharray" values="95 175;205 65;145 125;205 65" dur="4.8s" repeatCount="indefinite"/></path>
      <path d="M26 158h238" stroke="#3fb950"><animate attributeName="stroke-dasharray" values="160 110;238 32;205 65;238 32" dur="5.4s" repeatCount="indefinite"/></path>
    </g>
    <text x="316" y="72" fill="#39d5ff" font-family="Consolas, monospace" font-size="14">API</text>
    <text x="316" y="118" fill="#a371f7" font-family="Consolas, monospace" font-size="14">AI</text>
    <text x="316" y="164" fill="#3fb950" font-family="Consolas, monospace" font-size="14">SYS</text>
    <rect x="24" y="190" width="362" height="2" fill="#30363d"/>
    <rect x="24" y="186" width="44" height="10" fill="url(#neon)" filter="url(#glow)"><animate attributeName="x" values="24;342;24" dur="4s" repeatCount="indefinite"/></rect>
  </g>

  <g fill="#39d5ff" shape-rendering="crispEdges">
    <rect x="690" y="86" width="5" height="5"><animate attributeName="opacity" values=".15;1;.15" dur="1.7s" repeatCount="indefinite"/></rect>
    <rect x="660" y="132" width="5" height="5"><animate attributeName="opacity" values="1;.1;1" dur="2.1s" repeatCount="indefinite"/></rect>
    <rect x="705" y="270" width="5" height="5"><animate attributeName="opacity" values=".2;1;.2" dur="2.6s" repeatCount="indefinite"/></rect>
  </g>

  <path d="M48 328h1098" stroke="#30363d"/>
  <text x="48" y="348" fill="#586579" font-family="Consolas, 'Courier New', monospace" font-size="12">BUILDING RELIABLE SOFTWARE // ONE COMMIT AT A TIME</text>
</svg>

